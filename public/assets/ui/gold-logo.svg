<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-label="Dead Man's Ledger: The Money Engine gold logo">
  <defs>
    <style>
      .sweep { animation: logoSweep 5.8s ease-in-out infinite; transform-origin: 460px 130px; }
      .coin { animation: coinGlint 3.6s ease-in-out infinite; }
      @keyframes logoSweep {
        0%, 18% { transform: translateX(-520px) skewX(-14deg); opacity: 0; }
        38% { opacity: .55; }
        58%, 100% { transform: translateX(520px) skewX(-14deg); opacity: 0; }
      }
      @keyframes coinGlint {
        0%, 100% { opacity: .72; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sweep, .coin { animation: none; }
      }
    </style>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff6c5"/>
      <stop offset=".16" stop-color="#f3d27a"/>
      <stop offset=".38" stop-color="#b77728"/>
      <stop offset=".58" stop-color="#f8de8d"/>
      <stop offset=".78" stop-color="#c48a38"/>
      <stop offset="1" stop-color="#fff0ad"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#293b3f"/>
      <stop offset=".55" stop-color="#101d22"/>
      <stop offset="1" stop-color="#070d10"/>
    </linearGradient>
    <linearGradient id="sweepGold" x1="0" x2="1">
      <stop offset="0" stop-color="#fff8cb" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff8cb" stop-opacity=".62"/>
      <stop offset="1" stop-color="#fff8cb" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="plateClip"><path d="M82 64h756l28 30v92l-28 30H82l-28-30V94z"/></clipPath>
    <filter id="drop">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#000" flood-opacity=".72"/>
    </filter>
    <filter id="softGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f7d36f" flood-opacity=".44"/>
    </filter>
  </defs>
  <g filter="url(#drop)">
    <path d="M82 64h756l28 30v92l-28 30H82l-28-30V94z" fill="url(#darkMetal)" stroke="#c18a39" stroke-width="6"/>
    <path d="M82 64h756l28 30v92l-28 30H82l-28-30V94z" fill="none" stroke="#fff2b5" stroke-width="1.5" opacity=".34"/>
    <g clip-path="url(#plateClip)"><rect class="sweep" x="350" y="45" width="86" height="190" fill="url(#sweepGold)" opacity="0"/></g>
    <path d="M104 84h712l18 18v76l-18 18H104l-18-18v-76z" fill="none" stroke="#ffe4a1" stroke-width="2" opacity=".35"/>
    <path d="M139 130h642" stroke="#7c5c31" stroke-width="2" opacity=".75"/>
    <g filter="url(#softGlow)">
      <circle class="coin" cx="100" cy="130" r="30" fill="url(#gold)" stroke="#fff3bd" stroke-width="3"/>
      <path d="M86 126c11-14 28-14 39 0M86 137c11 14 28 14 39 0" fill="none" stroke="#241a0c" stroke-width="5" stroke-linecap="round"/>
      <rect class="coin" x="800" y="108" width="46" height="44" rx="5" fill="url(#gold)" stroke="#fff2b5" stroke-width="3"/>
      <path d="M807 116h32M807 130h32M807 144h32" stroke="#2a1d0d" stroke-width="4" stroke-linecap="round" opacity=".78"/>
    </g>
    <text x="460" y="126" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="900" fill="#5a3511" opacity=".75" transform="translate(0 5)">DEAD MAN'S LEDGER</text>
    <text x="460" y="126" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="900" fill="url(#gold)" stroke="#fff4bd" stroke-width=".85">DEAD MAN'S LEDGER</text>
    <text x="460" y="169" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="800" letter-spacing="7" fill="#ffe7a6" stroke="#5b3613" stroke-width=".8">THE MONEY ENGINE</text>
    <path d="M216 188h488" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" opacity=".92"/>
  </g>
</svg>
